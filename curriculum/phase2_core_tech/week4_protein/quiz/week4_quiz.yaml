title: "Phase 2 Week 4: 단백질과 구조 기반 설계 퀴즈"
description: "AlphaFold 구조 예측, 단백질-리간드 도킹과 DiffDock, 단백질 언어 모델(ESM), 그리고 Phase 2 전체 스택 통합 전략을 종합 점검합니다."
questions:
  - id: "p2w4q1"
    question: "AlphaFold2가 기존 물리 기반 구조 예측 대비 정확도를 크게 끌어올린 핵심 입력 요소는 무엇인가?"
    type: "multiple_choice"
    options:
      - "단일 서열만으로 물리 에너지를 최소화한다"
      - "다중서열정렬(MSA)에서 얻은 공진화(coevolution) 정보로 잔기 간 접촉을 추론한다"
      - "실험 결정학 데이터를 실시간으로 조회한다"
      - "분자 동역학 시뮬레이션을 수천 번 반복한다"
    answer: "1"
    explanation: "AlphaFold2의 정확도는 MSA에 담긴 진화적 공변이 신호에서 나옵니다. 함께 변하는 잔기 쌍은 3차원에서 접촉할 가능성이 높다는 원리이며, 이 때문에 상동 서열이 부족한 orphan 표적에서는 정확도가 떨어집니다."

  - id: "p2w4q2"
    question: "단백질-리간드 도킹에서 'scoring function'의 역할을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "리간드의 SMILES를 3D 구조로 변환하는 함수"
      - "생성된 결합 포즈(binding pose)의 결합 친화도를 추정해 포즈들을 순위화하는 함수"
      - "단백질 서열의 보존성을 계산하는 함수"
      - "분자의 합성 가능성을 평가하는 함수"
    answer: "1"
    explanation: "도킹은 (1) 가능한 결합 포즈를 탐색하고 (2) scoring function으로 각 포즈의 친화도를 추정해 순위를 매깁니다. 전통적 scoring function의 부정확성이 도킹의 오랜 약점이었고, 이를 신경망 스코어링으로 개선한 것이 Day 3의 주제였습니다."

  - id: "p2w4q3"
    question: "DiffDock이 전통적 도킹과 근본적으로 다른 접근을 취하는 지점은?"
    type: "multiple_choice"
    options:
      - "결합 포즈 탐색을 확산 모델(diffusion)로 생성 문제처럼 다룬다"
      - "MSA를 사용해 도킹 정확도를 높인다"
      - "리간드를 사용하지 않고 단백질만 입력한다"
      - "양자역학 계산으로 정확한 에너지를 구한다"
    answer: "0"
    explanation: "DiffDock은 포즈를 격자 탐색·에너지 최소화로 찾는 대신, 노이즈에서 시작해 올바른 결합 포즈로 점진적으로 복원하는 확산 생성 모델로 재정의했습니다. 이는 blind docking에서 속도·정확도 이점을 보였습니다."

  - id: "p2w4q4"
    question: "단백질 언어 모델(ESM)에서 '구조 정보가 emergent하다'는 말의 의미로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "구조 라벨로 직접 지도학습했기 때문에 구조를 안다"
      - "구조를 명시적으로 가르치지 않고 서열 마스크 예측만 학습했는데도, 어텐션·임베딩에 접촉 지도·이차구조 정보가 나타난다"
      - "PDB 구조를 검색해 복사한다"
      - "MSA를 내부적으로 생성해 구조를 계산한다"
    answer: "1"
    explanation: "ESM은 마스크드 언어 모델링(MLM)만으로 학습했지만, 어텐션 가중치가 long-range contact에 집중되고 임베딩에 이차구조·용매 접근성이 담깁니다. 진화적 제약을 서열에서 학습하면 구조 정보가 부수적으로 나타난다는 것이 핵심 통찰입니다."

  - id: "p2w4q5"
    question: "MSA 구성이 어려운 orphan(고아) 단백질 표적의 구조를 대규모로 빠르게 예측해야 한다. 가장 적합한 선택은?"
    type: "multiple_choice"
    options:
      - "AlphaFold2 — MSA 검색을 반드시 거쳐 최고 정확도를 확보한다"
      - "ESMFold — 단일 서열만으로 초 단위 예측이 가능해 MSA 부재·대규모 스캔에 적합하다"
      - "결정학 실험을 병렬로 진행한다"
      - "도킹 scoring function을 사용한다"
    answer: "1"
    explanation: "ESMFold는 MSA 없이 단일 서열로 초 단위 예측이 가능해, 상동 서열이 부족한 orphan 단백질이나 수억 개를 훑는 대규모 스크리닝에 결정적입니다. AF2는 MSA가 풍부한 well-studied 표적에서 최상위 정확도를 갖는 상보적 도구입니다."

  - id: "p2w4q6"
    question: "항암제 표적의 임상적 내성 변이(예: EGFR T790M)가 약물 결합에 미치는 영향을 라벨 데이터 없이 빠르게 우선순위화하려 한다. 가장 적절한 접근은?"
    type: "multiple_choice"
    options:
      - "ESM-1v 방식으로 야생형 vs 변이 서열의 log-likelihood 차이를 zero-shot 점수로 활용한다"
      - "모든 변이를 부위지정 돌연변이 실험으로 하나씩 측정한다"
      - "SMILES 기반 QSAR 모델로 단백질 변이를 예측한다"
      - "합성 가능성 점수(SA score)로 변이 영향을 판정한다"
    answer: "0"
    explanation: "ESM 계열의 zero-shot 변이 효과 예측은 라벨 데이터 없이 log-likelihood 차이로 변이의 해로움을 즉시 추정합니다. 실험은 정밀하지만 느리고, QSAR·SA score는 단백질 변이 문제에 맞지 않습니다."

  - id: "p2w4q7"
    question: "Phase 2 폐루프 스택에서 '가벼운 필터를 먼저, 무거운 검증을 나중에' 적용하는 이유로 가장 타당한 것은?"
    type: "multiple_choice"
    options:
      - "무거운 계산이 항상 부정확하기 때문"
      - "값싼 예측으로 다수 후보를 조기 탈락시켜, 비싼 도킹·정밀 스코어링을 소수 후보에만 적용해 비용·시간을 절감하기 때문"
      - "필터 순서는 결과에 영향을 주지 않기 때문"
      - "약학 지식이 필요 없어지기 때문"
    answer: "1"
    explanation: "생성 모델이 만든 대량 후보를 값싼 물성 예측으로 먼저 걸러내면, 계산 비용이 큰 도킹·정밀 스코어링을 살아남은 소수에만 적용할 수 있습니다. 필터 순서 설계가 파이프라인 효율을 좌우하며, 어떤 필터가 임상적으로 치명적인지는 약학 판단의 영역입니다."

  - id: "p2w4q8"
    question: "1인 창업자가 Insilico·Isomorphic 같은 풀스택 플레이어와 경쟁할 때 가장 현실적인 전략은?"
    type: "multiple_choice"
    options:
      - "동일한 풀스택 플랫폼을 처음부터 전부 재현한다"
      - "스택의 한 접점(예: 특정 표적군의 정밀 ADMET 필터)을 약학 지식으로 깊게 특화한다"
      - "자체 자동화 실험실을 먼저 구축한다"
      - "가장 큰 빅파마와 즉시 대형 파트너십을 맺는다"
    answer: "1"
    explanation: "풀스택은 막대한 자본·자동화 실험실을 요구해 1인 창업자가 재현하기 어렵습니다. 스택의 한 접점을 도메인 지식으로 깊게 잡는 것이 현실적이며, 오픈 모델(ESM·RDKit) 위에 약학적 해석 레이어를 얹는 것이 해자가 됩니다."

  - id: "p2w4q9"
    question: "단백질 설계·바이오로직스 영역에서 ESM-2 같은 오픈 PLM을 백본으로 쓸 때, 창업의 기술적 해자(moat)는 주로 어디에서 나오는가?"
    type: "multiple_choice"
    options:
      - "오픈 모델 가중치 자체를 소유하는 데서"
      - "약학 지식이 반영된 해석·검증 레이어와 특정 표적군의 실험 데이터로 튜닝한 다운스트림 헤드에서"
      - "가장 큰 파라미터 모델을 쓰는 데서"
      - "MIT 라이선스를 재배포하는 데서"
    answer: "1"
    explanation: "ESM-2는 MIT로 공개되어 누구나 쓸 수 있으므로 모델 자체는 해자가 아닙니다. 차별화는 특정 문제에 대한 도메인 해석 레이어와 독점 실험 데이터로 튜닝한 헤드에서 나옵니다."

  - id: "p2w4q10"
    question: "Phase 2 스택을 '생성 vs 평가'로 이분할 때, 다음 중 성격이 다른 하나는?"
    type: "multiple_choice"
    options:
      - "확산 모델 기반 3D 분자 생성"
      - "강화학습 목표지향 분자 생성"
      - "GNN 기반 물성(ADMET) 예측"
      - "VAE 기반 신규 분자 설계"
    answer: "2"
    explanation: "확산 모델·강화학습·VAE는 모두 후보를 만들어내는 '생성' 기술입니다. 반면 GNN 기반 물성·ADMET 예측은 만들어진 후보를 걸러내는 '평가·필터' 기술로, 스택에서 반대 역할을 담당합니다."
