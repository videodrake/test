title: "Phase 3 Week 3: LLM·Foundation Model·AI 에이전트 퀴즈"
description: "LLM의 작동 원리와 신약개발 활용, 화학 Foundation Model(MolFormer·Uni-Mol), 도구를 부리는 AI 에이전트(MCP·자동화 실험), RAG와 멀티모달, 그리고 이 네 기술을 통합한 차세대 AI의 창업 기회를 종합 점검합니다."
questions:
  - id: "p3w3q1"
    question: "대규모 언어 모델(LLM)이 사전학습(pretraining)에서 학습하는 근본 과제는 무엇인가?"
    type: "multiple_choice"
    options:
      - "분자의 3차원 좌표를 회귀 예측한다"
      - "방대한 텍스트에서 다음 토큰(next token)을 예측하며 언어의 통계적 구조를 익힌다"
      - "라벨링된 독성 데이터로 분류기를 직접 학습한다"
      - "강화학습으로 게임 점수를 최대화한다"
    answer: "1"
    explanation: "LLM은 대규모 텍스트에서 다음 토큰 예측이라는 자기지도(self-supervised) 과제로 언어의 패턴을 학습합니다. 이 범용 표현이 이후 요약·추론·질의응답 등 다양한 작업으로 전이됩니다."

  - id: "p3w3q2"
    question: "화학 Foundation Model(예: MolFormer, Uni-Mol)이 전통적 지도학습 QSAR 모델 대비 갖는 핵심 이점은?"
    type: "multiple_choice"
    options:
      - "라벨이 전혀 필요 없어 예측에 검증이 불필요하다"
      - "대량의 라벨 없는 분자로 사전학습해 얻은 표현을, 라벨이 적은 다운스트림 과제로 전이할 수 있다"
      - "물리 법칙을 직접 계산하므로 데이터가 필요 없다"
      - "항상 실험값과 100% 일치하는 예측을 보장한다"
    answer: "1"
    explanation: "Foundation Model은 방대한 무라벨 분자로 사전학습해 범용 분자 표현을 얻고, 이를 라벨이 부족한 과제(특정 물성·독성)로 전이(transfer)합니다. 라벨 부족이라는 신약개발의 고질적 병목을 완화하는 것이 핵심 가치입니다."

  - id: "p3w3q3"
    question: "AI 에이전트가 단순한 단발성 LLM 호출과 구별되는 결정적 특징은 무엇인가?"
    type: "multiple_choice"
    options:
      - "더 큰 모델을 쓴다는 점"
      - "계획을 세우고 외부 도구(검색·계산·장비)를 호출하며 다단계로 작업을 실행한다"
      - "항상 사람의 승인 없이 완전 자율로 작동한다"
      - "텍스트 대신 이미지로만 답한다"
    answer: "1"
    explanation: "에이전트는 목표를 하위 작업으로 분해하고, 도구를 호출해 행동하며, 결과를 관찰해 다음 단계를 정하는 다단계 루프를 돕니다. 추론에 '행동'을 붙였다는 점이 단발 호출과의 핵심 차이입니다."

  - id: "p3w3q4"
    question: "RAG(검색 증강 생성)에서 '의미 기반 검색(semantic search)'의 작동 방식으로 옳은 것은?"
    type: "multiple_choice"
    options:
      - "정확한 키워드 문자열 일치만으로 문서를 찾는다"
      - "질문과 문서를 임베딩 벡터로 바꿔 코사인 유사도가 높은 문서를 검색한다"
      - "문서를 무작위로 샘플링해 프롬프트에 넣는다"
      - "모델 파라미터를 재학습해 지식을 갱신한다"
    answer: "1"
    explanation: "RAG는 질의와 문서를 임베딩 공간의 벡터로 변환하고 코사인 유사도로 '뜻이 가까운' 문서를 찾습니다. 키워드 일치가 아닌 의미적 근접성을 이용하며, 이는 구조 유사성이 활성 유사성으로 이어진다는 SAR의 직관과 통합니다."

  - id: "p3w3q5"
    question: "규제가 엄격한 신약개발에서 통합 AI 시스템을 설계할 때, 자율성(autonomy) 수준에 대한 가장 합리적 기본값은?"
    type: "multiple_choice"
    options:
      - "모든 결정을 완전 자율 에이전트에 맡긴다"
      - "임상적 영향이 큰 작업에는 사람 개입(human-in-the-loop)을 두고, 되돌릴 수 있는 작업부터 자율화한다"
      - "사람 검토는 항상 불필요하므로 제거한다"
      - "속도를 위해 근거·출처 표기를 생략한다"
    answer: "1"
    explanation: "오류가 임상 결정으로 이어질 위험이 큰 영역에서는 human-in-the-loop이 기본값이어야 합니다. 문헌 정리·가설 생성처럼 되돌릴 수 있는(reversible) 작업에 자율성을 먼저 적용하는 것이 안전합니다."

  - id: "p3w3q6"
    question: "'물성 서술(예: 낮은 hERG 위험, 높은 BBB 투과) → 후보 분자 검색'처럼 자연어로 분자를 찾는 기능을 가능하게 하는 기술은?"
    type: "multiple_choice"
    options:
      - "단일 양식(text-only) LLM"
      - "분자-텍스트를 대조 학습으로 정렬한 멀티모달 모델(예: MoleculeSTM)"
      - "규칙 기반 SMILES 파서"
      - "단순 키워드 검색 엔진"
    answer: "1"
    explanation: "멀티모달 정렬은 분자 구조와 텍스트 설명을 공통 임베딩 공간에 대조 학습으로 정렬해, 자연어 질의로 분자를 검색하는 교차 양식(cross-modal) 질의를 가능하게 합니다. 약학적 물성 서술을 분자 검색의 질의어로 직접 쓸 수 있습니다."

  - id: "p3w3q7"
    question: "이번 Week의 네 기술(LLM·화학 FM·에이전트·RAG/멀티모달)의 관계를 가장 정확히 서술한 것은?"
    type: "multiple_choice"
    options:
      - "서로 대체하는 경쟁 기술이라 하나만 골라야 한다"
      - "배타적이지 않고 층으로 쌓여, 통합 시스템의 조립 부품으로 결합된다"
      - "모두 동일한 작업을 다른 이름으로 수행할 뿐이다"
      - "각각 별도 회사에서만 쓸 수 있어 결합이 불가능하다"
    answer: "1"
    explanation: "에이전트가 계획하고, 화학 FM이 분자를 이해하며, RAG가 근거를 대고, LLM이 이를 자연어로 엮는 식으로 네 기술은 층(layer)으로 결합됩니다. 경쟁 관계가 아니라 통합 시스템의 부품입니다."

  - id: "p3w3q8"
    question: "차세대 AI 신약개발 스타트업에서 '모델·프레임워크는 빠르게 상품화(commoditize)된다'는 관찰이 주는 창업 전략적 시사점은?"
    type: "multiple_choice"
    options:
      - "가장 큰 파운데이션 모델을 자체 개발하는 것이 유일한 해자다"
      - "해자는 모델이 아니라 독점 데이터·약학적 검증·워크플로 통합 같은 응용 계층에 심어야 한다"
      - "오픈소스를 절대 쓰지 말고 모든 것을 처음부터 만들어야 한다"
      - "응용 계층은 가치가 없으므로 인프라만 판다"
    answer: "1"
    explanation: "LLM·RAG·화학 FM은 API·오픈소스로 접근 가능해 그 자체로는 차별화가 어렵습니다. 가치는 응용 계층 — 독점 데이터, 약학적 검증 기준, 연구자의 워크플로에 박힌 통합 도구 — 으로 이동합니다."

  - id: "p3w3q9"
    question: "약사-창업자가 순수 소프트웨어 팀 대비 재현 불가능한 해자를 만들기 가장 좋은 지점은?"
    type: "multiple_choice"
    options:
      - "더 빠른 GPU 인프라 구축"
      - "'어떤 예측·근거가 임상적으로 유의미한가'라는 약학적 판단을 검증 기준으로 제품에 녹이는 것"
      - "더 화려한 UI 애니메이션"
      - "가장 저렴한 클라우드 요금제 협상"
    answer: "1"
    explanation: "모델의 공통 한계(환각·데이터 의존·도메인 판단 부재)는 모두 모델 바깥에 있습니다. 그중 임상적 유의성 판단(임계값·go/no-go 기준)은 약학 전공자만이 신뢰성 있게 주입할 수 있는, 소프트웨어 팀이 재현하기 어려운 경쟁력입니다."

  - id: "p3w3q10"
    question: "통합 AI 어시스턴트의 MVP를 설계할 때, 이번 Week의 원칙에 가장 부합하는 접근은?"
    type: "multiple_choice"
    options:
      - "처음부터 전 파이프라인을 완전 자율 에이전트로 자동화한다"
      - "하나의 좁은 워크플로(예: 특정 표적군 문헌 RAG + 유사체 검색 + 출처·불확실성 표기)부터 사람이 검토하는 반자동 도구로 시작한다"
      - "가능한 모든 질환·표적을 한 번에 지원하는 범용 도구를 만든다"
      - "검증·출처 표기는 나중으로 미루고 속도만 우선한다"
    answer: "1"
    explanation: "좁고 깊은 수직 워크플로에서 출발해 사람 검토로 신뢰를 먼저 쌓고, 이후 데이터·자율성을 단계적으로 확장하는 것이 현실적입니다. 규제 산업에서 근거·불확실성 표기는 미룰 수 없는 기본 요구입니다."
