title: "Phase 4 Week 2: 데이터·인프라·MLOps·배포와 기술 스택 결정 퀴즈"
description: "데이터 파이프라인(ChEMBL·PDB), 오픈소스 생태계(RDKit·PyG·HuggingFace·Ollama), MLOps(실험 추적·재현성), 배포(Docker·FastAPI·클라우드 GPU), 그리고 이를 종합한 스타트업 기술 스택 결정을 점검합니다."
questions:
  - id: "p4w2q1"
    question: "데이터 파이프라인(Day 66)에서 ChEMBL·PDB 같은 원천 데이터를 모델이 학습할 수 있는 형태로 만드는 과정의 핵심 목적을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "원천 데이터를 그대로 모델에 넣어 전처리 비용을 없애는 것"
      - "이질적 원천 데이터를 정제·특성화·표준화해 재현 가능한 학습용 데이터셋으로 전환하는 것"
      - "데이터를 최대한 많이 모아 모델 크기를 키우는 것"
      - "데이터를 암호화해 외부 유출을 막는 것"
    answer: "1"
    explanation: "파이프라인의 핵심은 이질적 원천을 정제·특성화·표준화해 재현 가능한 학습 데이터로 만드는 것입니다. 원천을 그대로 넣거나(1) 양만 늘리는 것(3)은 목적이 아니며, 암호화(4)는 별개의 보안 이슈입니다."
  - id: "p4w2q2"
    question: "Day 67의 오픈소스 생태계 관점에서, RDKit·PyG·HuggingFace를 적극 활용하는 것이 초기 스타트업에 갖는 의미로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "라이선스 비용을 아끼려 성능을 포기하는 절충"
      - "검증된 공통 기반을 재사용해 한정된 자원을 도메인 차별화에 집중시키는 것"
      - "오픈소스는 상업적 사용이 불가능하므로 학습용으로만 쓰는 것"
      - "직접 구현보다 항상 느리므로 프로토타입에서만 쓰는 것"
    answer: "1"
    explanation: "바퀴를 다시 만들지 않고 검증된 기반을 재사용해, 아낀 자원을 독점 데이터·도메인 모델 같은 차별화에 투입하는 것이 핵심입니다. 성능 포기(1)나 상업적 사용 불가(3)는 사실이 아닙니다."
  - id: "p4w2q3"
    question: "MLOps(Day 68)에서 말하는 '재현성(reproducibility)'을 구성하는 3요소로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "속도·정확도·비용"
      - "코드·데이터·환경"
      - "모델·논문·특허"
      - "GPU·CPU·메모리"
    answer: "1"
    explanation: "동일 결과를 다시 만들려면 코드(버전), 데이터(버전), 실행 환경이 모두 고정돼야 합니다. 나머지 보기는 재현성의 구성요소가 아니라 성능 지표나 하드웨어 자원입니다."
  - id: "p4w2q4"
    question: "배포(Day 69)에서 서버리스 GPU의 'scale to zero'가 제공하는 핵심 이점은?"
    type: "multiple_choice"
    options:
      - "GPU를 항상 최대로 가동해 레이턴시를 0으로 만든다"
      - "요청이 없을 때 GPU를 0개로 내려 유휴 비용을 없앤다"
      - "모델 정확도를 자동으로 높인다"
      - "데이터 저장 용량을 무제한으로 늘린다"
    answer: "1"
    explanation: "scale to zero는 요청이 없으면 자원을 0으로 내려 유휴 비용을 제거합니다. 대신 첫 요청 시 cold start 지연이 생깁니다. 정확도(3)나 저장 용량(4)과는 무관합니다."
  - id: "p4w2q5"
    question: "대화형 단분자 예측 도구와 수백만 분자 배치 스크리닝 중, 각각에서 우선 최적화해야 할 지표를 옳게 짝지은 것은?"
    type: "multiple_choice"
    options:
      - "대화형=처리량(throughput), 배치=레이턴시(latency)"
      - "대화형=레이턴시(latency), 배치=처리량(throughput)"
      - "둘 다 레이턴시만 중요하다"
      - "둘 다 저장 비용만 중요하다"
    answer: "1"
    explanation: "사용자를 기다리게 하는 대화형은 요청 하나의 시간(레이턴시)이, 대량을 묶어 도는 배치는 단위 시간당 처리량이 핵심입니다. 이는 약동학의 Cmax(반응 속도)와 AUC(총 노출)를 나눠 보는 사고와 같습니다."
  - id: "p4w2q6"
    question: "hERG 예측 API를 규제 대응이 가능한 서비스로 만들려 할 때, 배포 단계에서 반드시 포함해야 할 설계는?"
    type: "multiple_choice"
    options:
      - "응답 속도를 위해 로그를 남기지 않는다"
      - "모든 요청·응답과 사용된 모델 버전을 전량 로깅한다"
      - "모델 버전을 숨겨 경쟁사 모방을 막는다"
      - "예측값만 반환하고 불확실성은 생략한다"
    answer: "1"
    explanation: "규제·감사 대응의 최소 조건은 요청·응답·모델 버전의 전량 로깅입니다. 로그 미기록(1)이나 버전 은닉(3)은 감사 불가를 초래하고, 불확실성 생략(4)은 임상적 해석을 어렵게 합니다."
  - id: "p4w2q7"
    question: "초기 스타트업이 '되돌리기 어려운 결정(일방통행문)'으로 다뤄야 할 항목으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "서버리스 GPU 제공사 선택"
      - "실험 추적 도구의 UI 테마"
      - "데이터 스키마와 감사·응답 로깅의 존재 여부"
      - "Docker 베이스 이미지의 파이썬 버전"
    answer: "2"
    explanation: "데이터 스키마와 로깅 부재는 과거를 소급 복원할 수 없어 되돌리기 비용이 극히 높습니다. GPU 제공사·베이스 이미지·UI(1·2·4)는 언제든 교체 가능한 되돌리기 쉬운 결정입니다."
  - id: "p4w2q8"
    question: "시드 단계 AI 신약개발 스타트업이 아직 트래픽이 거의 없을 때, GPU 조달 방식으로 가장 자본 효율적인 초기 선택은?"
    type: "multiple_choice"
    options:
      - "고성능 GPU 클러스터를 자체 구매해 상시 가동한다"
      - "장기 예약 인스턴스를 대량 계약해 단가를 낮춘다"
      - "서버리스·온디맨드로 시작해 사용량이 검증되면 예약 인스턴스로 전환한다"
      - "GPU 없이 CPU만으로 모든 딥러닝 추론을 처리한다"
    answer: "2"
    explanation: "매출 없는 초기에는 유휴 GPU 비용이 현금 소진을 키우므로, 사용량만큼 내는 서버리스·온디맨드로 시작하는 것이 합리적입니다. 자체 구매(1)·대량 예약(2)은 조기 과잉투자, CPU 전용(4)은 성능상 비현실적입니다."
  - id: "p4w2q9"
    question: "'빌드 vs. 바이(build vs. buy)' 원칙을 AI 신약개발 스택에 적용할 때, 직접 만들어야(build) 할 대상으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "실험 추적 UI와 서빙 인프라"
      - "독점 데이터·도메인 특화 모델·규제 로직"
      - "Docker와 FastAPI 같은 범용 도구"
      - "클라우드 GPU 하드웨어"
    answer: "1"
    explanation: "해자와 직결되는 핵심(독점 데이터·도메인 모델·규제 로직)은 직접 만들고, 평준화된 비핵심(추적 UI·서빙·범용 도구·하드웨어)은 사서 씁니다. 유한한 초기 자원일수록 '만들지 않을 것'의 결정이 중요합니다."
  - id: "p4w2q10"
    question: "약학 전공 창업자가 AI 신약개발 기술 스택에서 가장 먼저 확보할 수 있는 차별적 경쟁력(moat)은?"
    type: "multiple_choice"
    options:
      - "Docker·FastAPI 배포 기술의 숙련도"
      - "가장 저렴한 클라우드 제공사를 찾는 능력"
      - "규제·감사 요구를 제품 요구사항으로 먼저 정의하고 재현성·로깅을 설계에 심는 역량"
      - "가장 큰 파라미터의 범용 LLM을 확보하는 것"
    answer: "2"
    explanation: "배포 도구·클라우드 가격·범용 LLM은 평준화돼 해자가 아닙니다. 약학 배경은 규제·감사 요구를 제품 초기에 요구사항으로 번역하고 재현성·로깅을 설계에 심을 수 있다는 점에서 비약학 전공자 대비 차별적입니다."
