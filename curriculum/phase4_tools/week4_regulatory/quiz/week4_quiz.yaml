title: "Phase 4 Week 4: 규제와 약학적 판단 퀴즈"
description: "AI 신약개발의 규제 현황(FDA·EMA·MFDS), 모델의 규제 제출과 신뢰성 평가, PK/PD 모델링과 AI 통합(MIDD), AI 생성 분자의 IP 전략, 그리고 이를 종합한 약사-창업자의 규제 경쟁력을 점검합니다."
questions:
  - id: "p4w4q1"
    question: "Day 76에서 다룬 'AI 신약개발의 규제'의 핵심 목적을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "AI 모델의 학습 속도를 규제 당국이 표준화하는 것"
      - "AI 모델이 생성한 데이터·판단을 규제 당국이 신뢰할 수 있는 근거로 수용하게 하는 제도적 틀"
      - "AI 사용을 금지해 전통적 실험만 인정하는 것"
      - "모델의 정확도를 90% 이상으로 의무화하는 것"
    answer: "1"
    explanation: "규제의 본질은 성능 그 자체가 아니라, 모델 출력을 규제 당국이 신뢰할 수 있는 근거로 받아들이게 하는 제도적 틀입니다. 속도 표준화(0)나 정확도 의무화(3)는 핵심이 아니며, AI 사용 금지(2)는 사실이 아닙니다."
  - id: "p4w4q2"
    question: "Day 77에서 다룬 FDA의 7단계 신뢰성 평가(credibility assessment) 프레임워크가 신뢰를 판단하는 기준으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "모델이 모든 상황에서 절대적으로 정확한가"
      - "특정 사용 맥락(context of use)과 위험 수준에 비추어 충분히 신뢰할 만한가"
      - "모델이 가장 최신 아키텍처를 사용했는가"
      - "학습 데이터가 가장 큰 규모인가"
    answer: "1"
    explanation: "프레임워크의 핵심은 절대적 정확도가 아니라 '사용 맥락과 위험에 비추어 목적 적합한가(fitness for purpose)'입니다. 이는 약학의 분석법 검증(ICH Q2) 논리와 같습니다. 아키텍처 최신성(2)이나 데이터 규모(3)는 기준이 아닙니다."
  - id: "p4w4q3"
    question: "Day 78에서 다룬 MIDD(Model-Informed Drug Development)와 AI의 관계를 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "AI는 규제의 백지 상태에서 완전히 새로운 경로를 만들어야 한다"
      - "AI는 PK/PD 모델링을 이미 규제 근거로 수용해 온 MIDD 경로에 새로운 종류의 모델로 편입된다"
      - "MIDD는 AI 등장으로 폐기되었다"
      - "AI 예측은 MIDD와 무관하게 독립적으로만 제출된다"
    answer: "1"
    explanation: "MIDD는 AI 이전부터 모델링 결과를 규제 근거로 수용해 온 기존 경로이며, AI는 여기에 새로운 모델로 편입됩니다. 백지에서 시작(0)하거나 MIDD가 폐기(2)된 것이 아닙니다."
  - id: "p4w4q4"
    question: "Day 79에서 다룬 AI 생성 분자의 발명자 적격성(inventorship) 원칙으로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "AI가 분자를 생성했으므로 AI가 공동발명자가 된다"
      - "AI는 발명자가 될 수 없고, 어떤 분자를 선택하고 왜 약효가 있을지 착상(conception)한 인간이 발명자다"
      - "AI를 사용한 발명은 더 엄격한 별도 기준으로 심사된다"
      - "AI 생성 분자는 누구도 발명자가 될 수 없어 특허가 불가능하다"
    answer: "1"
    explanation: "USPTO 개정 가이던스의 요지는 AI는 발명자가 될 수 없고 인간의 착상(conception)이 유일한 기준이라는 것입니다. AI 공동발명(0), 별도의 더 엄격한 기준(2), 특허 전면 불가(3)는 모두 틀립니다."
  - id: "p4w4q5"
    question: "리드 최적화 단계의 독성 스크리닝에 쓸 AI 모델의 규제 신뢰성을 준비한다. FDA 프레임워크에 비추어 가장 먼저 해야 할 일은?"
    type: "multiple_choice"
    options:
      - "모델의 전체 벤치마크 정확도를 최대한 끌어올린다"
      - "이 모델의 사용 맥락(COU)과 그에 따른 위험 등급을 정의한다"
      - "가능한 모든 가이드라인을 전부 동시에 충족시킨다"
      - "모델 가중치를 즉시 특허 출원한다"
    answer: "1"
    explanation: "7단계 프레임워크는 사용 맥락(COU)과 위험 등급 정의에서 출발합니다. 맥락이 정해져야 필요한 증빙 수준이 결정됩니다. 범용 정확도(0)나 전방위 대응(2)은 비효율적이고, 모델 가중치는 보통 영업비밀 대상입니다(3)."
  - id: "p4w4q6"
    question: "AI 모델 하나를 발굴한 신규 분자와 함께 보호하려 한다. '분자'와 '모델 가중치'의 보호 수단 조합으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "분자=영업비밀, 모델 가중치=특허"
      - "분자=특허, 모델 가중치=영업비밀"
      - "둘 다 특허"
      - "둘 다 영업비밀"
    answer: "1"
    explanation: "분자는 환자 투여 시 구조가 역설계되므로 비밀 유지가 불가능해 특허가 유일한 방어책이고, 모델 가중치는 외부 노출이 없어 영업비밀이 더 강력합니다. '공개 시 역설계되는 것은 특허, 비밀 유지 가능한 것은 영업비밀'이 원칙입니다."
  - id: "p4w4q7"
    question: "규제 제출을 위해 모델과 데이터를 상세히 문서화할 때 발생하는 긴장으로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "문서화가 많을수록 모델 성능이 저하된다"
      - "규제의 투명성 요구를 충족할수록 영업비밀 보호가 약해질 수 있다"
      - "문서화는 규제와 IP 양쪽에 아무 영향이 없다"
      - "문서화는 특허 출원을 자동으로 무효화한다"
    answer: "1"
    explanation: "규제는 투명성(상세 문서화)을 요구하지만, 과도한 공개는 영업비밀 보호를 약화시킵니다. 이 투명성 대 비밀유지의 균형 조율이 실전 전략의 핵심입니다. 성능 저하(0)나 특허 무효화(3)와는 무관합니다."
  - id: "p4w4q8"
    question: "약사-창업자가 투자 피칭에서 비전공자 팀 대비 가장 강력한 차별적 서사를 만드는 방식으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "모델의 벤치마크 정확도 수치를 경쟁사보다 높게 제시한다"
      - "모델의 사용 맥락·위험 등급·규제 충족·IP 보호를 하나의 신뢰 서사로 연결해 제시한다"
      - "가장 큰 학습 데이터셋 보유를 강조한다"
      - "가장 많은 특허 출원 건수를 강조한다"
    answer: "1"
    explanation: "VC와 빅파마는 '규제를 통과시킬 수 있는가'를 성능보다 먼저 묻습니다. 사용 맥락·규제 충족·IP 보호를 엮은 신뢰 서사가 자금을 끌어냅니다. 단순 정확도(0)·데이터 규모(2)·출원 건수(3)는 방어력을 증명하지 못합니다."
  - id: "p4w4q9"
    question: "규제 전환기(2025~2026, FDA AI 가이드라인 초안 단계)에 AI 신약개발 스타트업이 취할 수 있는 창업 기회로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "규제가 확정될 때까지 제품 개발을 전면 중단한다"
      - "7단계 credibility 문서를 프레임워크에 맞춰 생성·관리하는 도구 등 규제 역량을 제품화한다"
      - "규제를 무시하고 성능 경쟁에만 집중한다"
      - "해외 규제만 대응하고 국내는 포기한다"
    answer: "1"
    explanation: "규칙이 확정되기 직전의 전환기는 프레임워크를 먼저 내재화한 팀이 선점 우위를 갖는 시기입니다. 규제 역량 자체를 SaaS 등 제품으로 전환하는 것이 기회입니다. 개발 중단(0)이나 규제 무시(2)는 기회를 놓칩니다."
  - id: "p4w4q10"
    question: "Week 4가 강조하는 '규제 해자(moat)'가 기술 해자보다 방어력이 강한 이유로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "규제는 법으로 경쟁사의 진입을 영구히 금지하기 때문"
      - "알고리즘은 몇 달이면 복제되지만, 규제 소통 이력·검증 문서 자산·임상적 증빙 설계 역량은 복제에 수년이 걸리기 때문"
      - "규제 당국이 특정 회사에 독점권을 부여하기 때문"
      - "기술 해자는 존재하지 않기 때문"
    answer: "1"
    explanation: "규제 해자의 복제 불가능성은 법적 금지(0)나 독점권 부여(2)가 아니라, 규제 소통 이력과 검증 자산, 임상적으로 타당한 증빙 설계 역량이 단기간에 복제되지 않는다는 데서 나옵니다. 약학 지식이 이 해자를 만듭니다."
