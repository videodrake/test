title: "Phase 5 Week 1: 시장 분석과 포지셔닝 퀴즈"
description: "AI 신약개발 시장의 규모와 성장(Day 81), 글로벌 3대 경쟁사의 비즈니스 모델(Day 82), 한국 생태계의 자본·제도 구조(Day 83), 포지셔닝 좌표 선택법(Day 84), 그리고 이를 통합한 시장 기회 맵(Day 85)을 약사-창업자의 진입 전략 관점에서 점검합니다."
questions:
  - id: "p5w1q1"
    question: "Day 81에서 본 AI 신약개발 시장 규모 추정치가 기관마다 2024년 기준 약 9억 달러에서 63억 달러까지 크게 갈리는 가장 큰 이유는?"
    type: "multiple_choice"
    options:
      - "환율 변동으로 매년 수치가 바뀌기 때문"
      - "각 조사 기관이 '시장'의 정의와 포함 범위를 다르게 설정하기 때문"
      - "AI 신약개발 기업들이 매출을 공개하지 않기 때문"
      - "측정 오차로 인한 단순 반올림 차이이기 때문"
    answer: "1"
    explanation: "추정치 편차의 핵심 원인은 '시장 정의 범위'의 차이입니다. 발굴 소프트웨어만 포함하느냐, 서비스·파이프라인 가치까지 넣느냐에 따라 기준(base)이 수 배 달라집니다. 따라서 단일 숫자를 인용하기 전 각 보고서의 정의를 먼저 확인해야 합니다. 환율(0)이나 반올림(3)은 수 배 차이를 설명하지 못합니다."
  - id: "p5w1q2"
    question: "Day 82에서 분석한 글로벌 3사의 비즈니스 모델을 가장 정확히 짝지은 것은?"
    type: "multiple_choice"
    options:
      - "Insilico=물리 기반 SaaS, Recursion=발굴 엔진, Schrödinger=자체 파이프라인"
      - "Insilico=발굴 엔진+자체 파이프라인, Recursion=asset(자체 신약) 중심, Schrödinger=물리 기반 SaaS"
      - "셋 다 순수 SaaS 구독 모델로 동일하다"
      - "셋 다 임상·규제 번역 미들웨어에 집중한다"
    answer: "1"
    explanation: "Insilico는 발굴 엔진과 자체 파이프라인을 함께 추구하고, Recursion은 asset(자체 신약) 중심, Schrödinger는 물리 기반 예측 SaaS에 가깝습니다. 세 회사의 공통점은 모두 '발굴 앞단'에 몰려 있다는 것이며, 아무도 임상·규제 번역(3)을 본업으로 삼지 않습니다."
  - id: "p5w1q3"
    question: "Day 83에서 다룬 한국 AI 신약개발 생태계의 '삼각 자본 구조'를 구성하는 세 자본으로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "개인 엔젤·크라우드펀딩·은행 대출"
      - "전략적 투자자(SI)·재무적 투자자(FI)·정책 자본"
      - "미국 VC·유럽 VC·중국 VC"
      - "제약사 내부 자금만으로 구성된 단일 구조"
    answer: "1"
    explanation: "한국 생태계는 대형 제약·IT 대기업의 전략적 투자자(SI), 순수 수익을 노리는 재무적 투자자(FI), 그리고 산업은행·정부 R&D 등 정책 자본이 교차하는 삼각 구조입니다. 이는 약물의 다중 제거 경로처럼 단일 투자자 의존 위험을 분산시킵니다."
  - id: "p5w1q4"
    question: "Day 84의 포지셔닝 원리 '좁힐수록 강해진다(the riches are in the niches)'를 약학적으로 가장 정확히 대응시킨 것은?"
    type: "multiple_choice"
    options:
      - "약물 용량을 높일수록 효과가 커지는 용량-반응 관계"
      - "특정 수용체 아형에 고선택적으로 결합하는 약물이 치료지수가 높은 것"
      - "반감기가 길수록 약물이 우수한 것"
      - "분자량이 작을수록 흡수가 잘 되는 것"
    answer: "1"
    explanation: "좁은 포지셔닝은 수용체 선택성(selectivity)과 같습니다. 모든 수용체에 결합하면 부작용이 폭증하듯 모든 고객·단계를 겨냥하면 메시지가 희석됩니다. 반대로 특정 아형에 고선택적인 약물이 치료지수가 높듯, 좁고 깊은 포지셔닝이 초기 생존율을 높입니다."
  - id: "p5w1q5"
    question: "글로벌 거인과 같은 '범용 타겟·물질 발굴 플랫폼'으로 정면 진입하려는 약사-창업자에게 Week 1의 분석이 주는 가장 적절한 조언은?"
    type: "multiple_choice"
    options:
      - "기술력만 뛰어나면 자본 열세와 무관하게 이길 수 있으므로 진입하라"
      - "경쟁 밀도가 높고 자본 효율이 낮아 불리하므로, 약학 해자가 작동하는 좁은 좌표로 우회하라"
      - "국내 기업이 적은 분야이므로 빠르게 선점하라"
      - "규제가 가장 단순한 분야이므로 진입 장벽이 낮다"
    answer: "1"
    explanation: "발굴 엔진 칸은 글로벌·국내 모두 포화 상태이고 대규모 자본을 요구합니다. 자본 열세인 약사-창업자가 정면 승부하는 것은 청소율이 무한대인 상대에게 용량 경쟁을 거는 것과 같습니다. 약학 해자가 높고 자본 효율이 좋은 좁은 좌표(ADMET·규제 번역)로 우회하는 것이 정석입니다."
  - id: "p5w1q6"
    question: "Day 85의 시장 기회 맵 '네 렌즈' 통합 프레임에서, 어떤 진입 좌표가 '최적'으로 판정되려면 충족해야 하는 조건으로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "시장 매력도(L1) 하나만 가장 높으면 된다"
      - "시장·경쟁·제도·역량 네 렌즈를 동시에 만족하는 교집합이어야 한다"
      - "경쟁 밀도(L2)가 가장 높은 칸이어야 한다"
      - "약학 해자(L4)만 있으면 나머지는 무관하다"
    answer: "1"
    explanation: "시장 기회 맵의 핵심 원리는 '교집합 찾기'입니다. 큰 시장(L1)이면서 경쟁이 비고(L2) 제도가 보호하며(L3) 내 역량이 해자가 되는(L4) 네 조건을 동시에 만족해야 합니다. 이는 다중 파라미터 최적화(MPO)처럼 단일 지표 최대화가 아니라 다기준 균형입니다. 하나만 높은 좌표(0)는 탈락입니다."
  - id: "p5w1q7"
    question: "국내 AI 신약개발 기업 대부분이 '발굴·설계 레이어'에 몰려 있다는 Day 83의 관찰에서 약사-창업자가 끌어내야 할 전략적 함의로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "발굴이 가장 인기 있는 분야이므로 나도 발굴에 합류해야 한다"
      - "발굴 이후 단계(임상 번역·규제 제출·데이터 검증)의 소프트웨어 레이어가 비어 있다는 뜻이다"
      - "한국 시장은 포화되었으므로 창업을 포기해야 한다"
      - "국내 기업을 모두 인수해 통합해야 한다"
    answer: "1"
    explanation: "지도를 그리는 목적은 남이 어디 있는지가 아니라 '아무도 없는 칸'을 찾는 것입니다. 발굴에 쏠려 있다는 것은 거꾸로 임상 번역·규제 제출 레이어가 비어 있음을 뜻하며, 바로 이곳이 약학 해자가 작동하는 진입점입니다."
  - id: "p5w1q8"
    question: "약사-창업자가 코스닥 기술특례상장(Day 83)이라는 출구를 역산해 자본을 설계할 때, 글로벌 거인 대비 가장 큰 전략적 이점은?"
    type: "multiple_choice"
    options:
      - "임상 3상을 반드시 완료해야만 상장이 가능하다는 점"
      - "매출이 없어도 기술성 평가로 조기 상장해 자본시장에서 가치를 실현할 수 있다는 점"
      - "상장 후에는 규제 심사가 면제된다는 점"
      - "해외 투자자만 유치할 수 있다는 점"
    answer: "1"
    explanation: "코스닥 기술특례상장은 매출 없이도 기술성 평가로 조기 상장이 가능한 한국 특유의 출구입니다. 이는 수억 달러 임상 자본을 모으지 않고도 MVP→유료 PoC→기술성 평가 통과라는 단계적 가치 실현 경로를 가능하게 합니다. 임상 3상 완료(0)는 요건이 아닙니다."
  - id: "p5w1q9"
    question: "Day 85가 제시한 결론 좌표 '국내 임상·규제 번역 버티컬 SaaS'를 투자자에게 피칭할 때, 가장 설득력 있는 서사 구조는?"
    type: "multiple_choice"
    options:
      - "'우리는 발굴 AI를 하나 더 만든다'는 성능 경쟁 서사"
      - "'경쟁 공백 × 규제 순풍 × 약학 해자의 교집합에 선다'는 좌표 서사"
      - "'가장 큰 학습 데이터셋을 보유했다'는 규모 서사"
      - "'모든 질환·모든 단계를 다루는 범용 플랫폼'이라는 확장 서사"
    answer: "1"
    explanation: "VC와 빅파마는 차별화된 좌표와 방어 가능성을 먼저 봅니다. 네 렌즈의 교집합(경쟁 공백·규제 순풍·약학 해자)을 엮은 좌표 서사는 그 자체로 투자 논리가 되며, 이는 사업계획서의 첫 장이 됩니다. 성능 경쟁(0)·규모(2)·범용 확장(3)은 차별화를 증명하지 못합니다."
  - id: "p5w1q10"
    question: "Day 85는 시장 기회 맵을 '가설의 집합'이라 부르며 Week 2로 넘어가기 전 검증을 권합니다. 맵의 '번역 레이어 수요가 실재한다'는 가정을 가장 싸게 검증하는 방법은?"
    type: "multiple_choice"
    options:
      - "대규모 자본을 모아 제품을 완성한 뒤 출시해 반응을 본다"
      - "국내 발굴 기업 1~2곳에 ADMET 출력을 규제 언어로 번역하는 고충을 직접 묻는 고객 인터뷰를 한다"
      - "경쟁사의 특허를 모두 분석한다"
      - "시장 보고서를 10개 더 구매해 수치를 비교한다"
    answer: "1"
    explanation: "맵은 가설의 집합이며, 수요 실재 여부는 잠재 고객(국내 발굴 기업)에게 직접 고충을 묻는 인터뷰로 가장 싸고 빠르게 검증됩니다. 제품을 먼저 완성(0)하는 것은 가장 비싼 검증이며, 이 고객 인터뷰 결과가 Week 2 비즈니스 모델 설계의 입력이 됩니다."
