title: "Phase 5 Week 2: 비즈니스 모델과 전략 퀴즈"
description: "AI 신약개발 비즈니스 모델의 세 유형(Day 86), 제약사 대상 가격·수익 전략(Day 87), 빅파마 파트너십 계약 구조(Day 88), 성공/실패 사례의 위험 축 분해(Day 89), 그리고 이를 통합한 비즈니스 모델 캔버스(Day 90)를 약사-창업자의 전략 수립 관점에서 점검합니다."
questions:
  - id: "p5w2q1"
    question: "Day 86에서 구분한 AI 신약개발 비즈니스 모델 세 유형(SaaS/플랫폼, 발굴 서비스, 자체 파이프라인) 중, '신약 후보를 직접 보유하여 임상 상방을 노리지만 생물 위험에 가장 크게 노출되는' 모델은?"
    type: "multiple_choice"
    options:
      - "구독형 SaaS 미들웨어"
      - "발굴 대행 서비스(fee-for-service)"
      - "자체 파이프라인(asset-heavy)"
      - "오픈소스 도구 배포"
    answer: "2"
    explanation: "자체 파이프라인 모델은 신약 자산을 보유해 임상 성공 시 상방이 크지만, 표적 가설이 틀리면 회사가 흔들리는 생물 위험에 직접 노출됩니다(Day 89). SaaS(0)·서비스(1)는 후보를 보유하지 않아 이 위험을 지지 않습니다."
  - id: "p5w2q2"
    question: "Day 87에서 다룬 대로, 초기 AI 신약개발 SaaS가 '다수 고객에 분산된 반복 매출'을 추구하는 가장 핵심적인 이유는?"
    type: "multiple_choice"
    options:
      - "구독료가 일회성 수수료보다 항상 금액이 크기 때문"
      - "어느 한 계약의 실패가 회사 전체를 무너뜨리지 않도록 현금흐름을 분산하기 위해"
      - "제약사가 구독 외의 지불 방식을 법적으로 금지하기 때문"
      - "마일스톤 수익은 세금이 면제되기 때문"
    answer: "1"
    explanation: "반복 구독 매출의 전략적 핵심은 '분산'입니다. 단일 자산·단일 계약 의존은 BenevolentAI 사례(Day 89)처럼 치명적이며, 다수 고객에 분산된 현금흐름은 어느 한 실패에도 회사를 유지시킵니다. 금액 크기(0)나 세금(3)이 아니라 변동성 관리가 목적입니다."
  - id: "p5w2q3"
    question: "Day 88에서 설명한 빅파마 파트너십 계약 구조에서 'biobucks'라는 표현이 가리키는 간극을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "선급금(upfront)과 실제 지급되는 현금이 동일하다는 뜻"
      - "계약서에 명시된 총액(마일스톤 전부 달성 가정)과 실제 수령 가능성이 큰 선급금 사이의 큰 간극"
      - "바이오 기업끼리만 통용되는 가상화폐"
      - "임상 성공이 100% 보장된 확정 금액"
    answer: "1"
    explanation: "'biobucks'는 모든 마일스톤을 달성했을 때의 계약 총액을 가리키는 업계 표현으로, 실제로 초기에 확보되는 선급금과는 큰 차이가 있습니다. 대부분의 마일스톤은 임상·규제 성공에 조건부이므로, 총액을 실현 매출로 오인하면 안 됩니다."
  - id: "p5w2q4"
    question: "Day 89의 위험 축 프레임에서, '완벽하게 설계된 분자가 틀린 표적에 작용해 임상 효능 평가변수를 놓친' 상황은 주로 어느 위험 축의 실패인가?"
    type: "multiple_choice"
    options:
      - "화학 위험(chemistry risk)"
      - "생물 위험(biology risk)"
      - "자본 위험(capital risk)"
      - "환율 위험"
    answer: "1"
    explanation: "분자가 설계대로 작동했다면 화학 위험(0)은 통과한 것입니다. 효능이 나오지 않은 원인이 '표적 가설이 질병을 바꾸지 못함'이라면 이는 생물 위험의 실패입니다. BenevolentAI의 BEN-2293이 안전성은 통과했으나 효능을 놓친 전형적 사례입니다."
  - id: "p5w2q5"
    question: "당신은 제약사 규제팀을 상대로 규제 번역 SaaS를 판매하려 합니다. Day 87~88의 교훈에 비춰, 초기 계약 구조로 가장 적합한 것은?"
    type: "multiple_choice"
    options:
      - "전액 성과 기반 — 품목 승인 시에만 대금을 받는다"
      - "월 구독료(기본 플랫폼) + 품목별 규제 제출 동행 시 성과 마일스톤 옵션"
      - "일회성 라이선스 판매 후 추가 과금 없음"
      - "후보물질 지분을 받고 플랫폼은 무료 제공"
    answer: "1"
    explanation: "구독료는 분산된 반복 매출로 현금흐름을 안정시키고(Day 87), 성과 옵션은 제한적 상방을 더합니다(Day 88). 전액 성과형(0)은 승인까지 현금이 없어 런웨이가 무너지고, 지분 수취(3)는 생물 위험을 떠안게 되어(Day 89) SaaS의 장점을 잃습니다."
  - id: "p5w2q6"
    question: "AI 신약개발 회사를 평가할 때, 홍보 문구 'AI로 18개월 만에 후보 발굴'을 Day 89 프레임으로 올바르게 해석하면?"
    type: "multiple_choice"
    options:
      - "임상 효능이 검증되었다는 의미이므로 투자 가치가 입증된 것"
      - "화학 위험(발굴·설계) 축의 성과일 뿐, 생물 위험(임상 효능)은 별개로 아직 검증되지 않음"
      - "그 회사가 이미 자본 위험을 모두 해소했다는 신호"
      - "발굴 속도가 느린 회사보다 반드시 임상 성공률이 높다는 증거"
    answer: "1"
    explanation: "발굴 속도는 화학 위험 축의 성과입니다. 임상 효능(생물 위험)과는 다른 칸에 적어야 하며, 빠른 발굴이 좋은 약을 보장하지 않습니다(Day 89). 속도와 임상 성공을 혼동하는 것이 가장 흔한 오독입니다."
  - id: "p5w2q7"
    question: "Day 90 비즈니스 모델 캔버스에서, 작성자가 '저가 셀프서비스 SaaS'를 수익원으로 적으면서 동시에 '전담 컨설턴트의 고접촉 밀착 지원'을 고객 관계로 적었습니다. 이 캔버스의 문제는?"
    type: "multiple_choice"
    options:
      - "블록이 너무 적어 정보가 부족하다"
      - "수익원(저가)과 고객 관계(고비용 고접촉)가 비용 구조상 서로 모순된다"
      - "캔버스는 원래 그런 모순을 허용하는 도구다"
      - "가치 제안 블록이 비어 있어서다"
    answer: "1"
    explanation: "캔버스의 핵심은 블록 간 정합성입니다. 저가 수익 모델은 저비용 셀프서비스 관계를 요구하는데, 고접촉 지원은 비용 구조를 무너뜨립니다. 캔버스는 바로 이런 모순을 드러내는 진단 도구입니다(Day 90)."
  - id: "p5w2q8"
    question: "Day 86~90을 통합할 때, 우리 규제 번역 SaaS가 Exscientia·BenevolentAI 대비 갖는 전략적 차별점을 가장 정확히 요약한 것은?"
    type: "multiple_choice"
    options:
      - "더 뛰어난 AI 발굴 알고리즘을 보유했다"
      - "신약 후보를 보유하지 않아 화학·생물 위험을 피하고, 통제 가능한 실행 위험만 진다"
      - "임상 Phase III까지 자체적으로 진행할 자본을 이미 확보했다"
      - "빅파마와 전량 주식교환 합병을 목표로 한다"
    answer: "1"
    explanation: "우리 캔버스의 방어력은 '어느 위험 축을 지느냐'에서 나옵니다. 후보 미보유로 화학·생물 위험을 피하고, 분산 매출로 자본 위험을 낮추며, 실행 위험만 집니다(Day 89~90). 알고리즘 우위(0)나 거액 자본(2)이 차별점이 아닙니다."
  - id: "p5w2q9"
    question: "투자 피치에서 '약사-창업자' 서사를 가장 설득력 있게 제시하는 방법은?"
    type: "multiple_choice"
    options:
      - "'약사라서 신약개발을 잘 압니다'라고 포괄적으로 강조한다"
      - "규제 지식이 캔버스의 핵심 자원·핵심 활동·가치 제안 세 블록에서 각각 구체적 가치로 작동함을 명시한다"
      - "임상 데이터를 직접 생성할 수 있다고 주장한다"
      - "약학 학위가 경쟁사 대비 유일한 진입장벽이라고 단언한다"
    answer: "1"
    explanation: "강점은 막연한 주장이 아니라 캔버스의 '어느 블록에서 구체적 가치로 환산되는가'로 증명해야 합니다(Day 90). 규제 전문성이 핵심 자원·활동·가치 제안 세 곳에서 동시에 작동한다는 설명이 '약사라서 좋다'(0)보다 훨씬 설득력 있습니다."
  - id: "p5w2q10"
    question: "완성된 비즈니스 모델 캔버스를 투자자에게 제시할 때, Day 90이 권하는 태도로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "가장 강력한 블록만 집중적으로 강조하고 약점은 숨긴다"
      - "가장 취약한 블록(예: 초기 고객 획득)을 먼저 지목하고 이를 보강할 실행 계획을 제시한다"
      - "9개 블록을 모두 동일한 비중으로 나열하기만 한다"
      - "경쟁사 캔버스를 비판하는 데 대부분의 시간을 쓴다"
    answer: "1"
    explanation: "투자자는 강점이 아니라 가장 약한 블록을 공격합니다. 약점(우리의 경우 초기 레퍼런스 고객 확보)을 먼저 인정하고 보강 계획(다음 Week의 MVP 전략)을 제시하는 창업자가 신뢰를 얻습니다(Day 90)."
