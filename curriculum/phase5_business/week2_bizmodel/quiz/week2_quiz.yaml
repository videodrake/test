title: "Phase 5 Week 2: 비즈니스 모델과 전략 퀴즈"
description: "SaaS·플랫폼·파이프라인 세 비즈니스 모델의 현금 흐름 구조(Day 86), 가치 기반 가격 설계(Day 87), 빅파마 파트너십의 계약 구조와 biobucks(Day 88), 성공/실패 사례의 위험 축 분해(Day 89), 그리고 이를 통합한 비즈니스 모델 캔버스(Day 90)를 약사-창업자의 전략 판단 관점에서 점검합니다."
questions:
  - id: "p5w2q1"
    question: "Day 86에서 다룬 SaaS·플랫폼(공동개발)·파이프라인 세 모델의 현금 흐름 특성을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "세 모델 모두 초기 자본 소요와 수익 시점이 거의 동일하다"
      - "SaaS는 반복 매출로 현금 흐름이 비교적 이르고 예측 가능하며, 파이프라인은 자본 소요가 크고 수익이 가장 늦다"
      - "파이프라인 모델이 가장 적은 자본으로 가장 빨리 수익을 낸다"
      - "플랫폼 모델은 제약사와 위험을 나누므로 스타트업의 자본 소요가 SaaS보다 항상 적다"
    answer: "1"
    explanation: "SaaS는 구독 기반 반복 매출로 현금 흐름이 이르고 예측 가능한 반면, 파이프라인은 자체 임상까지 큰 자본이 들고 수익이 가장 늦습니다. 같은 기술이라도 모델에 따라 필요 자본과 수익 시점이 전혀 달라지는 것이 핵심이며(0은 틀림), 파이프라인이 가장 빠른 수익(2)이라는 설명은 반대입니다."
  - id: "p5w2q2"
    question: "Day 87에서 B2B 제약 영역의 가격이 '제품이 얼마나 좋은가'가 아니라 주로 무엇으로 결정된다고 했는가?"
    type: "multiple_choice"
    options:
      - "경쟁사보다 무조건 저렴한지 여부"
      - "고객이 이 제품으로 무엇을 절약하거나 벌 수 있는가(가치 기반)"
      - "제품 개발에 투입된 원가에 고정 마진을 더한 값"
      - "사용된 AI 모델의 파라미터 수"
    answer: "1"
    explanation: "가치 기반 가격(value-based pricing)은 고객이 얻는 절약·수익(예: 임상 지연 비용, 규제 보완요구 비용 절감)으로 값을 매깁니다. 원가 가산(2)이나 단순 저가 경쟁(0)은 가치를 반영하지 못합니다. 약사-창업자는 AI가 막아주는 실패의 가치를 숫자로 환산할 수 있어 이 영역에서 우위를 가집니다."
  - id: "p5w2q3"
    question: "Day 88에서 다룬 'biobucks'의 의미로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "스타트업이 계약 즉시 받는 선급금(upfront)만을 가리키는 말"
      - "먼 미래의 마일스톤·로열티까지 모두 합산한, 조건부 최대 명목 금액"
      - "빅파마가 지분 투자로 지급하는 희석성 자본"
      - "로열티율을 백분율로 표시한 지표"
    answer: "1"
    explanation: "biobucks는 선급금에 미래의 조건부 마일스톤·로열티까지 모두 더한 '명목 최대치'로, 발표되는 '수십억 달러' 숫자의 대부분을 차지합니다. 실제 현재가치는 위험조정(각 단계 성공확률)으로 환산해야 하며, 선급금(0)만을 뜻하지 않습니다."
  - id: "p5w2q4"
    question: "Day 90의 비즈니스 모델 캔버스에서 좌·우 두 진영이 각각 의미하는 바로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "왼쪽은 과거 실적, 오른쪽은 미래 계획"
      - "오른쪽은 가치의 창출·전달(고객·가치·채널·수익), 왼쪽은 가치를 만드는 비용(자원·활동·파트너·비용)"
      - "왼쪽은 국내 사업, 오른쪽은 해외 사업"
      - "오른쪽은 기술, 왼쪽은 마케팅"
    answer: "1"
    explanation: "캔버스의 오른쪽은 가치의 창출과 전달(고객 세그먼트·가치 제안·채널·수익원), 왼쪽은 그 가치를 만드는 비용(핵심 자원·활동·파트너·비용 구조)입니다. 지속가능한 사업은 오른쪽(수익)이 왼쪽(비용)을 초과하며, 이는 약물의 benefit-risk 평가와 동형입니다."
  - id: "p5w2q5"
    question: "AI 신약개발 스타트업이 '발굴 속도'를 핵심 성과로 홍보할 때, Day 89의 위험 축 프레임에서 주의해야 할 점으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "발굴이 빠르면 임상 효능도 자동으로 보장되므로 그대로 신뢰하면 된다"
      - "발굴 속도는 화학 위험 축의 성과일 뿐, 임상 효능(생물 위험)과는 다른 칸에 적어야 한다"
      - "발굴 속도는 자본 위험과 동일한 지표이므로 런웨이로 환산해야 한다"
      - "발굴 속도는 규제 승인 확률과 같은 의미이다"
    answer: "1"
    explanation: "'빠른 발굴'은 화학 위험(설계·합성)을 줄인 성과이지, 표적 가설이 질병을 바꾸는지(생물 위험)를 증명하지 않습니다. BenevolentAI의 BEN-2293처럼 분자는 '작동'해도 표적 가설이 틀리면 임상은 실패합니다. 둘을 혼동하면 '빠른 발굴=좋은 약'이라는 잘못된 결론에 이릅니다."
  - id: "p5w2q6"
    question: "우리 규제 번역 SaaS의 캔버스를 점검하던 중, '가치 제안(규제 실패 비용 절감)'과 'per-report 수익원'의 연결을 검증하려 한다. 가장 먼저 확인할 숫자는?"
    type: "multiple_choice"
    options:
      - "경쟁사의 홈페이지 방문자 수"
      - "고객이 보완요구 1건을 줄일 때 아끼는 금액이 report 가격의 수 배인지"
      - "회사의 누적 커밋 수"
      - "LLM 제공사의 분기 매출"
    answer: "1"
    explanation: "오른쪽 사슬(가치 제안→수익원)이 성립하려면, 고객이 얻는 절약액이 지불 가격을 충분히 상회해야 합니다. 보완요구 1건 절감액이 report 가격의 수 배가 아니면 고객은 지불 논리를 받아들이지 않습니다. 이는 다음 단계에서 실데이터로 검증할 1순위 가설입니다."
  - id: "p5w2q7"
    question: "Day 88의 옵션 구조를 캔버스에 반영할 때, '핵심 파트너' 블록에 둔 빅파마 협업이 장차 어느 블록으로 이동할 수 있는가?"
    type: "multiple_choice"
    options:
      - "비용 구조"
      - "수익원(마일스톤·성과 기반 매출로 전환)"
      - "채널"
      - "고객 관계"
    answer: "1"
    explanation: "SaaS→플랫폼 확장 경로에서, 초기에 '핵심 파트너'로 둔 빅파마 옵션 구조는 성과 마일스톤이 실현되면 '수익원' 블록으로 이동합니다. 캔버스는 정적 스냅샷이 아니라 성장 단계별로 다시 그리는 동적 문서라는 점을 보여 줍니다."
  - id: "p5w2q8"
    question: "약사-창업자가 투자자에게 우리 사업의 차별성을 설명할 때, Day 89의 사례들을 근거로 내세울 수 있는 가장 설득력 있는 포지셔닝은?"
    type: "multiple_choice"
    options:
      - "우리는 가장 많은 신약 후보를 직접 보유하고 있다"
      - "우리는 화학·생물 위험이 아니라 실행 위험만 지며, 임상 효능 실패에 구조적으로 노출되지 않는다"
      - "우리는 경쟁사보다 더 큰 선급금을 받을 수 있다"
      - "우리는 단일 대형 계약에 집중해 매출을 극대화한다"
    answer: "1"
    explanation: "BenevolentAI·Exscientia를 무너뜨린 생물·자본 위험을 구조적으로 회피하는 포지션('picks and shovels')이 초기 스타트업의 생존 전략입니다. 단일 자산 보유(0)나 단일 계약 집중(3)은 오히려 Day 89가 경고한 변동성을 키웁니다."
  - id: "p5w2q9"
    question: "SaaS 단위 경제성에서 통상 건강한 기준으로 보는 LTV/CAC 값과 그 의미로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "LTV/CAC ≥ 3 — 고객 생애가치가 획득비용의 3배 이상이어야 지속가능하다"
      - "LTV/CAC ≤ 1 — 획득비용이 생애가치보다 커야 성장한다"
      - "LTV/CAC = 0 — 고객 획득에 비용이 들지 않아야 한다"
      - "LTV/CAC는 파이프라인 모델에만 적용되는 지표이다"
    answer: "0"
    explanation: "LTV/CAC는 고객 생애가치(LTV)를 획득비용(CAC)으로 나눈 값으로, 통상 3 이상을 건강한 SaaS의 기준으로 봅니다. 가격·유지기간이 LTV를, 채널·영업이 CAC를 결정하므로 Day 87과 Day 86의 결정이 이 한 비율에서 만납니다. 1 이하(1)는 손실 구조입니다."
  - id: "p5w2q10"
    question: "완성된 비즈니스 모델 캔버스가 투자 유치 단계에서 갖는 역할로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "캔버스는 내부 문서일 뿐 피치덱과는 무관하다"
      - "피치덱의 핵심 슬라이드(문제·솔루션·시장·비즈니스 모델·경쟁 우위)가 캔버스 블록에서 직접 도출되는, 피치의 뼈대 역할을 한다"
      - "캔버스는 규제 당국 제출용 서류이다"
      - "캔버스는 완성되면 더 이상 수정하지 않는 최종 문서이다"
    answer: "1"
    explanation: "피치덱의 핵심 슬라이드는 모두 캔버스의 블록에서 도출됩니다. 캔버스가 정합적이면 피치는 설득력을 얻고, 빈 블록이 있으면 투자자는 정확히 그 지점을 질문합니다. 또한 캔버스는 성장 단계별로 다시 그리는 동적 문서이므로 '최종 문서'(3)가 아닙니다."
