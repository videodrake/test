title: "Phase 5 Week 3: 실행 — 팀, 투자, 런칭 퀴즈"
description: "MVP에서 PMF까지의 경로(Day 91), 약사·개발자·과학자 초기 팀 구성(Day 92), VC·정부·바이오 펀드를 섞는 자금 전략(Day 93), 투자자를 설득하는 피칭·스토리텔링(Day 94), 그리고 이를 통합한 실행 로드맵(Day 95)을 약사-창업자의 실행 판단 관점에서 점검합니다."
questions:
  - id: "p5w3q1"
    question: "Day 91에서 다룬 제품-시장 적합성(PMF)에 가장 가까운 설명은?"
    type: "multiple_choice"
    options:
      - "제품의 기능 수가 경쟁사보다 많아진 상태"
      - "고객이 제품을 실제로 원하고 재구매·추천이 자발적으로 일어나기 시작한 상태"
      - "코드 커버리지와 기술 부채가 모두 목표치를 만족한 상태"
      - "투자 라운드가 목표액을 초과 달성한 상태"
    answer: "1"
    explanation: "PMF는 '시장이 제품을 끌어당기는' 상태, 즉 재구매·추천 등 수요의 자발적 신호로 확인됩니다. 기능 수(0)나 코드 품질(2), 조달 성공(3)은 PMF의 직접 증거가 아닙니다."
  - id: "p5w3q2"
    question: "Day 95의 '임계 경로(critical path)' 개념을 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "가장 많은 인원이 투입된 과업"
      - "전체 완료 시점을 결정하는, 가장 긴 의존 사슬 위의 과업들"
      - "가장 비용이 많이 드는 단일 과업"
      - "가장 먼저 시작하는 과업"
    answer: "1"
    explanation: "임계 경로는 전체 일정을 좌우하는 가장 긴 의존 사슬입니다. 이 경로 위 과업이 지연되면 프로젝트 전체가 지연되므로 자원을 우선 배정해야 합니다. 인원 수(0)·비용(2)·시작 시점(3)과는 직접 관계가 없습니다."
  - id: "p5w3q3"
    question: "Day 93에서 자금 조달이 '마일스톤 단위'로 이뤄지는 근본 이유로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "투자자가 시간이 지나는 것 자체에 더 많은 돈을 내기 때문"
      - "투자자는 위험이 하나 제거될 때(가치 상승 지점) 더 높은 가치로 추가 투자하기 때문"
      - "법적으로 한 번에 큰 금액을 투자하는 것이 금지되어 있기 때문"
      - "마일스톤마다 세금 혜택이 다르기 때문"
    answer: "1"
    explanation: "투자자는 '시간 경과'가 아니라 '제거된 위험(가치 상승 지점)'에 더 높은 밸류에이션으로 돈을 냅니다. 그래서 마일스톤과 자금 라운드를 일치시키는 것이 핵심입니다. 0은 반대이고, 2·3은 사실이 아닙니다."
  - id: "p5w3q4"
    question: "Day 94에서 제시한 '혼합 서사(mixed narrative)'의 핵심 구조로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "플랫폼 비전만 강조하고 구체적 성과는 숨긴다"
      - "플랫폼의 비전을 말하되, 그것이 작동한다는 증거로 구체적 파이프라인·성과를 제시한다"
      - "파이프라인 단일 후보물질에만 집중해 설명한다"
      - "기술 지표(AUC·F1)를 슬라이드 전면에 배치한다"
    answer: "1"
    explanation: "2024~2025년 투자자가 선호하는 혼합 서사는 '플랫폼의 증거는 파이프라인'이라는 구조입니다. 비전(플랫폼)과 증거(구체적 성과)를 함께 제시합니다. 순수 비전(0)·순수 파이프라인(2)·지표 자랑(3)은 각각의 약점을 그대로 노출합니다."
  - id: "p5w3q5"
    question: "우리 규제 번역 SaaS의 실행 로드맵(Day 95)에서 임계 경로 노드로 가장 타당한 것은?"
    type: "multiple_choice"
    options:
      - "대시보드 UI에 다크 모드를 추가하는 작업"
      - "유료 고객이 우리 번역으로 규제 보완요구를 실제로 줄였다는 재현 가능한 가치 증거 확보"
      - "회사 로고와 브랜드 가이드라인 확정"
      - "사내 코드 리뷰 프로세스 문서화"
    answer: "1"
    explanation: "재현 가능한 가치 증거는 피치(Day 94)의 라이브 데모 재료이자 다음 조달(Day 93)을 여는 열쇠이므로 임계 경로의 핵심 노드입니다. UI 다크 모드(0)·브랜딩(2)·내부 문서(3)는 전체 일정을 좌우하지 않는 비임계 과업입니다."
  - id: "p5w3q6"
    question: "시드 조달액은 같은데 PMF 게이트까지 런웨이가 부족하다고 판정되었다. Day 95의 원리상 가능한 '세 가지 조정'에 해당하지 않는 것은?"
    type: "multiple_choice"
    options:
      - "제품 범위를 축소한다"
      - "검증할 가설(게이트)을 축소한다"
      - "조달 시점을 앞당긴다"
      - "임상 3상 규모의 실험을 추가로 집어넣는다"
    answer: "3"
    explanation: "런웨이가 부족할 때의 조정은 범위 축소·게이트 축소·조달 시점 앞당김의 세 가지입니다. 비용이 큰 실험을 추가하는 것(3)은 소진율을 높여 런웨이를 더 단축시키므로 정반대의 선택입니다."
  - id: "p5w3q7"
    question: "Day 92의 약사+개발자+과학자 초기 팀 구성에서, 약사-창업자가 맡는 가장 차별적인 역할은?"
    type: "multiple_choice"
    options:
      - "서버 인프라 운영과 배포 자동화"
      - "모델 출력의 임상적 타당성 판단과 규제 맥락으로의 번역"
      - "프런트엔드 디자인 시스템 구축"
      - "클라우드 비용 최적화"
    answer: "1"
    explanation: "약사-창업자의 비복제 역할은 모델 출력을 임상·규제 언어로 해석·검증하는 것입니다(불공정한 우위). 인프라(0)·디자인(2)·비용(3)은 엔지니어링 역할이 더 적합하며, 외주·채용으로 대체 가능합니다."
  - id: "p5w3q8"
    question: "Day 94의 '신뢰의 비대칭(credibility asymmetry)'을 약사-창업자가 유리하게 쓰는 방법으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "모델의 한계와 검증 조건을 숨겨 완벽해 보이게 한다"
      - "투자자가 묻기 전에 스스로 한계·검증 조건(예: temporal split 여부)을 제시해 신뢰를 높인다"
      - "가능한 한 높은 정확도 숫자만 반복해서 강조한다"
      - "경쟁사의 약점만 집중적으로 공격한다"
    answer: "1"
    explanation: "선제적으로 한계와 검증 조건을 밝히는 것은 바이오 전문 투자자에게 신뢰를 급격히 높이는 기법이며, 약학적 엄밀함이 설득력이 되는 지점입니다. 한계 은폐(0)·정확도 자랑(2)·경쟁사 공격(3)은 오히려 의심을 키웁니다."
  - id: "p5w3q9"
    question: "Day 93·95의 관점에서, 저-번(low-burn) 팀 구성이 창업자에게 주는 전략적 이점으로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "제품 품질을 자동으로 높여준다"
      - "같은 조달액으로 런웨이가 길어져, 현금이 급하지 않은 상태에서 더 좋은 조건으로 협상할 여유가 생긴다"
      - "투자자가 반드시 더 큰 금액을 투자하게 만든다"
      - "규제 승인 속도를 직접 단축시킨다"
    answer: "1"
    explanation: "저-번은 런웨이를 늘려 다음 마일스톤 도달 시간을 벌고, 급하지 않은 창업자가 더 나은 밸류에이션·조건을 얻게 합니다(Day 93의 비희석 우선 전략과 결합). 품질(0)·규제 속도(3)와는 직접 관계가 없고, 조달 강제(2)도 성립하지 않습니다."
  - id: "p5w3q10"
    question: "투자자에게 가장 설득력 있는 자금 요청 방식으로, Day 94·95의 원리에 부합하는 것은?"
    type: "multiple_choice"
    options:
      - "'18개월 운영비로 10억이 필요합니다'처럼 기간과 총액으로 요청한다"
      - "'유료 고객 N곳과 재현 가능한 가치 데이터라는 다음 마일스톤에 도달하는 데 X가 필요합니다'처럼 제거할 위험으로 요청한다"
      - "'경쟁사보다 더 많이 투자받고 싶습니다'처럼 규모 경쟁으로 요청한다"
      - "'일단 최대한 많이 투자해 주세요'처럼 열린 금액으로 요청한다"
    answer: "1"
    explanation: "투자자는 '얼마·얼마 동안'이 아니라 '이 돈으로 제거되는 위험(다음 마일스톤)'을 삽니다. 따라서 마일스톤·go/no-go 기준에 묶은 요청이 가장 설득력 있습니다. 기간·총액(0), 규모 경쟁(2), 열린 금액(3)은 위험 제거 서사를 담지 못합니다."
