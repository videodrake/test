title: "Week 4: 캡스톤 프로젝트 퀴즈"
description: "Phase 5 Week 4(캡스톤) — 비전 정의, 기술 아키텍처, 사업계획서, 피칭 덱, 100일 결산을 종합 점검합니다."
questions:
  - id: "w4q1"
    question: "캡스톤에서 사업계획서(business plan)와 피칭 덱(pitch deck)의 역할 차이를 가장 정확히 설명한 것은?"
    type: "multiple_choice"
    options:
      - "사업계획서는 리스크 제거를 증명하는 증거 문서, 피칭 덱은 관심을 얻어 다음 미팅을 만드는 서사 도구다"
      - "사업계획서는 투자자용, 피칭 덱은 고객용으로 독자가 완전히 다르다"
      - "둘은 같은 내용이며 길이만 다르다"
      - "피칭 덱이 더 상세하고 사업계획서는 요약본이다"
    answer: "0"
    explanation: "사업계획서는 모든 증거를 담아 리스크 제거를 증명하는 문서이고, 피칭 덱은 그 증거를 내러티브 아크로 압축해 '다음 미팅'을 만드는 설득 도구입니다. 둘은 목적이 다르며 피칭 덱이 더 상세한 것이 아닙니다."
  - id: "w4q2"
    question: "피칭 덱 슬라이드 설계의 핵심 원칙으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "한 슬라이드에 가능한 많은 데이터를 넣어 신뢰를 준다"
      - "한 슬라이드는 하나의 메시지만 전달하고, 설명은 말로 한다"
      - "과학적 메커니즘을 최대한 상세히 설명한다"
      - "요청(Ask)은 구체적 금액 없이 '투자해 달라'로 끝낸다"
    answer: "1"
    explanation: "'메시지 1개 + 그림 1개'가 원칙입니다. 슬라이드에 글을 다 적으면 발표자가 읽기만 하게 되고, 메커니즘 과잉 설명·모호한 Ask는 대표적 실수입니다."
  - id: "w4q3"
    question: "100일 커리큘럼이 '능력의 의존 사슬(dependency chain)'로 설계되었다는 말의 의미로 가장 정확한 것은?"
    type: "multiple_choice"
    options:
      - "각 Phase가 다음 Phase의 전제가 되어, 기초 없이 상위 역량이 성립하지 않는다"
      - "모든 Day를 순서와 무관하게 학습해도 동일한 효과를 낸다"
      - "비즈니스 내용이 기술 내용보다 항상 먼저 온다"
      - "각 Phase는 독립적이어서 하나만 깊이 파도 창업이 가능하다"
    answer: "0"
    explanation: "Phase 1(기초)→2~3(핵심 기술)→4(실무)→5(창업)는 약물의 작용 사슬처럼 순차적 의존 관계를 가집니다. 기초 언어 없이 상위 판단이 성립하지 않습니다."
  - id: "w4q4"
    question: "통합 파이프라인 지도에서 약사-창업자의 강점(★)이 발휘되는 두 지점으로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "분자 표현 선택과 단백질 구조 예측"
      - "ADMET 결과의 임상적 해석과 임상·규제 검증 전략"
      - "생성모델 학습과 도킹 스코어링"
      - "웹앱 배포와 데이터 파이프라인 구축"
    answer: "1"
    explanation: "ADMET 출력의 임상적 의미 해석(P2 W3)과 임상시험·규제 검증(P3 W4·P4 W4)이 약학 전공자가 비전문 창업자를 압도하는 구간입니다. 나머지는 도메인 지식보다 기술 숙련의 영역입니다."
  - id: "w4q5"
    question: "투자자가 던지는 '킬 퀘스천(kill question)' 중, 약사-창업자가 복제 불가능한 수준으로 방어하기에 가장 적합한 것은?"
    type: "multiple_choice"
    options:
      - "웹 서버 비용을 어떻게 절감할 것인가?"
      - "UI 색상 선택의 근거는 무엇인가?"
      - "규제기관이 AI 생성 문서를 수용할 근거는 무엇이며, 임상 실패 시 플랫폼 가치는 어떻게 되는가?"
      - "팀의 깃허브 커밋 빈도는 얼마인가?"
    answer: "2"
    explanation: "규제 수용성과 임상 성공률은 FDA/MFDS 제출 프로세스·단계별 임상 성공률·사람 검토 체크포인트 지식으로 방어해야 하며, 이는 약학 훈련 없이는 답하기 어려운 질문입니다."
  - id: "w4q6"
    question: "캡스톤 산출물을 하나의 폴더로 정리하는 것이 실무적으로 중요한 이유로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "파일 용량을 줄이기 위해"
      - "투자 실사(due diligence)에서 요구되는 데이터룸(data room)의 초안이 되기 때문"
      - "GitHub Pages 배포 속도를 높이기 위해"
      - "커리큘럼 빌드 오류를 막기 위해"
    answer: "1"
    explanation: "시장 맵·캔버스·MVP 설계·팀 구성·사업계획서·피칭 덱은 투자 실사에서 요구되는 문서의 상당 부분과 겹칩니다. 미리 정리하면 데이터룸 초안이 되어 실사 대응 속도가 빨라집니다."
  - id: "w4q7"
    question: "'규제 번역 AI' SaaS 가설을 검증할 때, MVP 코드 제작보다 먼저 해야 할 가장 적절한 행동은?"
    type: "multiple_choice"
    options:
      - "모델 정확도를 99%까지 끌어올리기"
      - "5~10곳의 잠재 고객(제약사 RA/임상팀 등) 인터뷰로 지불 의사를 확인하기"
      - "특허를 먼저 출원하기"
      - "클라우드 GPU를 대량 선구매하기"
    answer: "1"
    explanation: "핵심 리스크는 기술이 아니라 '제약사가 돈을 낼 것인가'입니다. 코드 제작 전에 고객 인터뷰로 페인포인트와 지불 의사를 검증하는 것이 린 스타트업의 기본입니다. 약학 네트워크가 이 접근의 자산이 됩니다."
  - id: "w4q8"
    question: "90일 실행 로드맵의 '검증(61~90일)' 단계에서 확보해야 할 가장 핵심적인 증거는?"
    type: "multiple_choice"
    options:
      - "완벽하게 완성된 제품"
      - "지불 의사(willingness to pay)의 증거 — 파일럿, LOI 또는 소액 유료 계약"
      - "100명 이상의 무료 사용자"
      - "학술 논문 게재"
    answer: "1"
    explanation: "초기 검증의 목표는 완제품이 아니라 '돈을 낼 의사'의 증거입니다. 파일럿·LOI·소액 유료 계약이 다음 투자 라운드의 트랙션 슬라이드를 채웁니다."
  - id: "w4q9"
    question: "2024~2025년 AI 신약개발 업계 결산에서 Insilico의 rentosertib(INS018_055) 사례가 갖는 핵심 의미는?"
    type: "multiple_choice"
    options:
      - "AI가 생성한 분자는 임상에 진입할 수 없음을 보여줬다"
      - "생성 AI로 타겟과 분자를 모두 발굴한 후보가 임상 2a상 데이터를 보고하며 'AI 발굴→실제 임상' 서사를 검증했다"
      - "AI 신약은 전임상 단계에서만 유효하다"
      - "임상 데이터보다 모델 벤치마크가 더 강력한 트랙션임을 증명했다"
    answer: "1"
    explanation: "rentosertib는 생성 AI로 타겟·분자를 모두 발굴한 후보가 IPF 임상 2a상(GENESIS-IPF)에 진입해 데이터를 보고한 사례로, 'AI 발굴→실제 임상'이라는 검증된 서사의 대표 예입니다. 세부 수치는 최신 원문 확인이 필요합니다."
  - id: "w4q10"
    question: "100일 프로그램이 제시하는, 빅테크도 쉽게 복제하기 어려운 장기적 해자(moat)로 가장 적절한 것은?"
    type: "multiple_choice"
    options:
      - "가장 큰 GPU 클러스터"
      - "가장 많은 공개 모델 파라미터 수"
      - "독점 임상·규제 데이터와 약학적 도메인 판단의 축적"
      - "가장 화려한 웹 UI"
    answer: "2"
    explanation: "모델과 컴퓨팅은 자본으로 따라잡을 수 있지만, 구조화된 독점 데이터(임상·규제 문서, 실패 교훈, ADMET 임계값 판단)와 도메인 전문성은 복제가 어렵습니다. 프로그램의 마지막 메시지는 '경쟁력은 AI가 아니라 AI를 약학적으로 판단하는 창업자 자신'이라는 것입니다."
